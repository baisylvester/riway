name: Verify RIWAY platform
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  optional-browser-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Exercise customer and staff workflows in a disposable database
        shell: bash
        run: |
          mkdir -p .cache
          RIWAY_DISPOSABLE_BROWSER=1 node tests/fixtures/browser-server.mjs > .cache/optional-browser-server.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:4174/auth/login > /dev/null; then break; fi
            sleep 1
          done
          RIWAY_DISPOSABLE_BROWSER=1 PLAYWRIGHT_EXTERNAL_SERVER=1 PLAYWRIGHT_PORT=4174 npx playwright test tests/e2e/optional-workflows.spec.ts --workers=1 --output=.cache/optional-browser-results
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: optional-browser-diagnostics
          include-hidden-files: true
          path: |
            .cache/optional-browser-server.log
            .cache/optional-browser-results/
  postgres-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: riway_test
          POSTGRES_PASSWORD: disposable-fixture-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riway_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:postgres
        env:
          RIWAY_TEST_DISPOSABLE: "1"
          RIWAY_TEST_PG_PORT: "5432"
          RIWAY_POSTGRES_BIN: /usr/bin
          PGPASSWORD: disposable-fixture-only
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:4173
      # Optional measurement IDs (repository variables). Empty means no
      # analytics scripts, no CSP allowance and no consent banner.
      NEXT_PUBLIC_GA4_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA4_MEASUREMENT_ID }}
      NEXT_PUBLIC_META_PIXEL_ID: ${{ vars.NEXT_PUBLIC_META_PIXEL_ID }}
      PAYMENT_PROVIDER: disabled
      RIWAY_INTEGRATION: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Build Cloudflare Worker on Linux
        run: npm run build:cloudflare
      - name: Prepare deployable Worker bundle
        run: npx wrangler deploy --dry-run --outdir .cloudflare-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: riway-cloudflare-bundle
          include-hidden-files: true
          path: |
            .cloudflare-bundle/
            .open-next/assets/
      - if: env.NEXT_PUBLIC_SUPABASE_URL != '' && env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY != ''
        run: npx playwright install --with-deps chromium
      - if: env.NEXT_PUBLIC_SUPABASE_URL != '' && env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY != ''
        run: npm run test:e2e
