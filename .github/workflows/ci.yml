name: Verify RIWAY platform
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  postgres-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: riway_test
          POSTGRES_PASSWORD: disposable-fixture-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riway_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:postgres
        env:
          RIWAY_TEST_DISPOSABLE: "1"
          RIWAY_TEST_PG_PORT: "5432"
          RIWAY_POSTGRES_BIN: /usr/bin
          PGPASSWORD: disposable-fixture-only
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:4173
      PAYMENT_PROVIDER: disabled
      RIWAY_INTEGRATION: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Build Cloudflare Worker on Linux
        run: npm run build:cloudflare
      - name: Prepare deployable Worker bundle
        run: npx wrangler deploy --dry-run --outdir .cloudflare-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: riway-cloudflare-bundle
          include-hidden-files: true
          path: |
            .cloudflare-bundle/
            .open-next/assets/
      - if: env.NEXT_PUBLIC_SUPABASE_URL != '' && env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY != ''
        run: npx playwright install --with-deps chromium
      - if: env.NEXT_PUBLIC_SUPABASE_URL != '' && env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY != ''
        run: npm run test:e2e
