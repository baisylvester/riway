name: Deploy validated RIWAY payment gateway

on:
  push:
    branches: [integration/payment-gateway]
    paths: [.github/workflows/deploy-payment-gateway.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: riway-platform-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/integration/payment-gateway'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://riway-platform.pages.dev
    timeout-minutes: 15
    steps:
      - name: Check Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets. Never put the token in source or logs."
            exit 1
          fi

      - name: Check out the tested application revision
        uses: actions/checkout@v4
        with:
          ref: 6f49f452a944a86cfea44346684b235aa0e6bba0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Download the validated Linux build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache/riway-approved-build
          curl --fail --silent --show-error --location --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            https://api.github.com/repos/baisylvester/riway/actions/artifacts/14788935068/zip \
            --output .cache/riway-approved-build.zip
          echo '63abf194eeaa7bbea2d42b3b27baf94332bcef89558e0e20a2d9b81323018281  .cache/riway-approved-build.zip' | sha256sum --check --strict
          unzip -q .cache/riway-approved-build.zip -d .cache/riway-approved-build
          test -f .cache/riway-approved-build/.cloudflare-bundle/custom-worker.js
          test -d .cache/riway-approved-build/.open-next/assets

      - name: Install the pinned deployment dependencies
        run: npm ci

      - name: Deploy the verified artifact to the existing RIWAY Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-cloudflare-artifact.mjs .cache/riway-approved-build

      - name: Confirm the deployed gateway health response
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 \
            https://riway-platform.pages.dev/api/health --output .cache/deployed-health.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          const health = JSON.parse(fs.readFileSync(".cache/deployed-health.json", "utf8"));
          assert.equal(health.status, "ok");
          assert.equal(health.xendit, "disabled");
          console.log(JSON.stringify(health));
          NODE

      - name: Run deployed HTTP integration checks
        env:
          TEST_BASE_URL: https://riway-platform.pages.dev
        run: node tests/integration/http.mjs
